# Batterie cpool_day06 — C Pool Day06 « Pointers are back ».
#
# 17 exercices, un seul appel système autorisé côté étudiant :
# my_putchar. L'étudiant ne rend NI son main NI son my_putchar.c :
# chaque task est compilée avec le harness de la batterie
# (harness/main_<task>.c + harness/my_putchar.c officiel), comme la
# vraie moulinette qui ajoute SES main.c et my_putchar.c.
#
# Les tasks « Unit tests » du sujet (04, 11, 17 — tests Criterion à
# écrire par l'étudiant) ne sont PAS des functions à corriger : elles
# sont ignorées. Task 18 (my_putnbr_base) est hors de la liste de la
# mission.
#
# cflags SANS -Werror, comme cpool_day03 : la compile est jugée sur le
# C, la norme par l'étape Norme. Sous epiclang, banana tourne à la
# compile et ses diagnostics de style deviennent des erreurs avec
# -Werror — dont la C-H1 (« function declaration in source file »),
# structurellement inévitable pour my_showstr/my_showmem : le sujet
# interdit de rendre my_putchar.c, chaque delivery qui affiche doit
# donc DÉCLARER `void my_putchar(char c);`. La vraie moulinette ne
# bloque pas la compile sur le style ; nous non plus.
#
# Contrairement à day03, la plupart des fonctions du jour NE
# s'affichent pas : elles retournent un pointeur ou un int. Les
# harness impriment donc le résultat :
# - fonctions char* avec buffer modifié (strcpy, strncpy, revstr,
#   strupcase, strlowcase, strcapitalize) : pour chaque cas,
#   `ret=<chaîne retournée>|buf=<dump du buffer>` — buffer memset à '#'
#   et plafonné par un '\0' AVANT l'appel (état initial déterministe,
#   les octets non écrits restent visibles), dump octet par octet à
#   taille fixe ('\0' affiché `\0`, non-imprimable `\xNN` minuscule,
#   '\' doublé) ;
# - my_strstr : `ret=<chaîne ou (null)>` ;
# - fonctions int (strcmp, strncmp, is*, getnbr_base) : `%d` par appel ;
# - my_showstr / my_showmem : sortie BRUTE de la fonction suivie de
#   `|<ret>` (stdout en mode non-bufferisé pour que le write() de
#   my_putchar et les printf restent dans l'ordre). Le format de
#   my_showmem reproduit celui du sujet au caractère près, adresses =
#   offsets 0-based %08x (déterministe, comme l'exemple du sujet),
#   padding calé sur sa dernière ligne (lignes de 66 caractères).
#
# strcmp/strncmp : les valeurs retournées suivent man 3 strcmp
# (différence des premiers octets distincts, en unsigned char — comme
# la libc) ; les cas de test restent dans l'ASCII, où cette sémantique
# est la seule lecture possible du sujet.

[project]
name = "cpool_day06"
type = "functions"
allowed_functions = ["my_putchar"]
tests_run_rule = false
cflags = ["-Wall", "-Wextra"]

[[task]]
name = "my_strcpy"
delivery = "my_strcpy.c"
prototype = "char *my_strcpy(char *dest, char const *src)"
harness = "cpool_day06/harness/main_my_strcpy.c"
extra_sources = ["cpool_day06/harness/my_putchar.c"]
stdout_file = "cpool_day06/expected/my_strcpy.out"
exit_code = 0
timeout_ms = 2000

