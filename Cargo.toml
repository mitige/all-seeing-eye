[package]
name = "all-seeing-eye"
version = "0.1.0"
edition = "2021"
description = "All-Seeing Eye — moulinette Epitech 2026-2027, en local"

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
object = "0.36"
libc = "0.2"
similar = "2"
serde_json = "1"
tempfile = "3"
dirs = "5"
regex = "1"
include_dir = "0.7"

[profile.release]
lto = true
codegen-units = 1
